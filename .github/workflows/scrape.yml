name: RB Checker Scraper

on:
  schedule:
    - cron: "1,21,41 * * * *"   # záloha, hlavní spouštění chodí z NASu přes workflow_dispatch
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Krok "Set up Python" vynechán: ubuntu-latest má Python 3 s pipem
    # předinstalovaný, actions/setup-python stál 6 s navíc.
    - name: Install dependencies
      run: pip install --quiet beautifulsoup4 requests

    - name: Run scraper
      run: python scraper.py

    - name: Commit changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add rb_history.json
        git commit -m "Update RB history" || echo "No changes"
        git pull --rebase
        git push
